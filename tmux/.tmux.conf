# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Input
set -sg escape-time 0
set -g focus-events on
set -g mouse on

# Scrollback
set -g history-limit 10000

# Colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Indexing
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Status bar
set -g status-style "bg=#3a3a3a,fg=#d0d0d0"
set -g status-left " #S "
set -g status-left-style "bg=#5f87af,fg=#1c1c1c,bold"
set -g status-right " %d %b %H:%M "
set -g status-right-style "bg=#444444,fg=#b0b0b0"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#5f87af,fg=#1c1c1c,bold"
